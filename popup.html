<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>idp chooser</title>
  <style>
    body {
      min-height: 150px;
      margin: 10;
      padding: 14px;
      width: 340px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #111;
    }

    .idpdd {
      position: relative;
      width: 100%;
    }

    .idpdd * {
      box-sizing: border-box;
    }

    .idpdd-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      cursor: pointer;
      gap: 10px;
      transition: box-shadow 0.45s ease;
    }

    .idpdd-btn:focus {
      outline: none;
      box-shadow: inset 0 0 0 2px #e7e7e7;
    }

    .idpdd-title {
      font-size: 13px;
      height: 18px;
      margin-top: 4px;
      margin-right: 0;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .idpdd-sub {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .idpdd-right {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }

    .idpdd-left {
      min-width: 0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .idpdd-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }

    .idpdd-caret {
      margin-bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #666;
      border-bottom: 2px solid #666;
      transform: rotate(45deg);
      /* margin-left: 2px; */
      transition: transform 0.1s ease;
    }

    .idpdd-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      border: 1px solid #cfcfcf;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      z-index: 1000;
      display: none;
      height: 300px;
    }

    .idpdd-panel.open {
      display: block;
    }

    .idpdd-search {
      padding: 10px;
      border-color: #ddd;
      border-bottom: 1px solid #eee;
    }

    .idpdd-search input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 13px;
    }

    .idpdd-search input:focus,
    .idpdd-search input:focus-visible {
      outline: none;
      border-color: #939393;
      box-shadow: none;
    }

    .idpdd-list {
      max-height: 320px;
      overflow: auto;
    }

    .idpdd-item {
      display: flex;
      align-items: left;
      padding: 10px 12px;
      cursor: pointer;
      gap: 12px;
    }

    .idpdd-desc {
      display: flex;
      align-items: left;
      justify-content: space-between;
      padding: 0;
      gap: 0px;
    }

    .idpdd-item:hover,
    .idpdd-item[aria-selected="true"] {
      background: #f6f8ff;
    }

    .idpdd-item-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .idpdd-item-desc {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0px;
      pointer-events: none;
    }

    .idpdd-item-name {
      font-size: 13px;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .idpdd-item-cat {
      margin-left: 8px;
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .btn {
      border: 1px solid #cfcfcf;
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .btn:hover {
      background: #f6f6f6;
    }

    hr {
      margin: 0;
      margin-left: 4px;
      padding: 0;
      opacity: 0.2;
    }

    .rotated {
      transform: rotate(225deg);
      transition: transform 0.1s ease;
      margin-bottom: 0px;
      margin-top: 4px;
    }

    body {
      background-color: white;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 12px 0;
    }

    .setting-text {
      display: flex;
      flex-direction: column;
    }

    .setting-title {
      font-size: 13px;
      font-weight: 500;
      color: #222;
    }

    .setting-desc {
      font-size: 12px;
      color: #666;
    }

    /* toggle switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .toggle input:checked + .slider {
      background: #227725;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(20px);
    }

    .popup {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 300ms ease, transform 300ms ease;
  will-change: opacity, transform;
}

/* animate to visible */
.popup.is-open {
  opacity: 1;
  transform: translateY(0);
}
  </style>
</head>

<body>
  <div class="panel popup">

    <div class="hint">
      Choose an organization for the Auto-Login
    </div>
    <div id="mount"></div>

    <div class="setting-row">
  <div class="setting-text">
    <div class="setting-title">Auto-Forward</div>
    <div class="setting-desc">
      Automatically forward after organization is selected
    </div>
  </div>

  <label class="toggle">
    <input type="checkbox" />
    <span class="slider"></span>
  </label>
</div>
    <script src="popup.js"></script>
  </div>
</body>

</html>
